<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>NeutronDict</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    /* Cửa sổ popup: hẹp và thấp, nên bố cục là ba tầng cố định — thanh tra ở
       trên, phần kết quả cuộn ở giữa, thanh chân ở dưới. */
    body { width: 400px; }
    .top { padding: 12px 12px 10px; background: var(--surface); box-shadow: 0 1px 0 var(--line-soft); }
    .brandrow { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
    .brandrow .mark {
      width: 28px; height: 28px; border-radius: 9px; flex: none;
      display: grid; place-items: center; background: var(--grad); color: #fff;
    }
    .brandrow .nm { font-size: 14.5px; font-weight: 750; letter-spacing: -0.01em; }
    .brandrow .streak {
      margin-left: auto; display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 700; color: var(--spark);
      background: var(--spark-soft); border-radius: var(--r-pill); padding: 4px 10px;
    }
    .searchrow { display: flex; gap: 7px; align-items: center; }
    .searchrow .searchfield { flex: 1; min-width: 0; }
    .searchrow select { width: auto; flex: none; font-size: 13px; padding: 10px 8px; border-radius: var(--r-pill); }
    .body { max-height: 400px; overflow-y: auto; padding: 12px; }
    .foot { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); box-shadow: 0 -1px 0 var(--line-soft); background: var(--surface); }
    .entry { padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
    .entry:first-child { padding-top: 2px; }
    .entry:last-child { border-bottom: none; }
    .entry .m { margin: 6px 0 0; padding-left: 20px; font-size: 14px; }
    .entry .m li { margin: 2px 0; }
    /* Tab Chi tiết: định nghĩa, ví dụ, từ đồng nghĩa tiếng Anh */
    .detail .ipa { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13.5px; margin: 0 0 12px; }
    .detail .ipa b { color: var(--accent); font-weight: 700; }
    .pgroup { padding: 11px 0; border-bottom: 1px solid var(--line-soft); }
    .pgroup:last-child { border-bottom: none; }
    .pos {
      display: inline-block; font-size: 11.5px; font-weight: 700; color: #fff;
      background: var(--accent-2); border-radius: var(--r-xs);
      padding: 2px 9px; text-transform: lowercase; margin-bottom: 7px;
    }
    .pgroup ol { margin: 4px 0 0; padding-left: 21px; font-size: 14px; }
    .pgroup li { margin: 4px 0; }
    .ex { color: var(--ink-3); font-style: italic; margin-top: 2px; }
    .syn { color: var(--accent); font-size: 13px; margin-top: 6px; }
    .legend { margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--line-soft); }
    .legend .lh { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; color: var(--ink-3); margin-bottom: 7px; }
    .legend .lh a { color: var(--accent); text-decoration: none; }
    .legrow { display: flex; gap: 9px; align-items: baseline; padding: 4px 0; font-size: 13px; }
    .legrow .ls { font-size: 16px; font-weight: 750; color: var(--accent); min-width: 28px; }
    .legrow .lv { color: var(--ink); }
    .legrow .le { color: var(--ink-3); }
    .trbox .tr { font-size: 16px; line-height: 1.6; }
    .trbox .furi { display: flex; align-items: center; gap: 6px; color: var(--accent); font-size: 13px; margin-top: 8px; }
    .trbox .src {
      color: var(--ink-2); font-size: 13px; margin-top: 11px; padding: 10px 12px;
      background: var(--surface-2); border-radius: var(--r-sm); word-break: break-word;
    }
    .state { padding: 28px 12px; text-align: center; color: var(--ink-3); font-size: 14px; }
    .state .ic { display: block; margin: 0 auto 8px; color: var(--line); }
    .save.saved { color: var(--good); border-color: var(--good-soft); background: var(--good-soft); }
    /* Sửa nghĩa & ghi chú ngay tại đây, không phải mở Sổ tay */
    .acts { display: flex; gap: 5px; flex: none; }
    .edbox { margin-top: 9px; }
    .edbox .field-label { font-size: 11.5px; margin: 10px 0 4px; }
    .edbox .field-label:first-child { margin-top: 0; }
    .edbox textarea { min-height: 0; font-size: 13.5px; padding: 8px 11px; border-radius: var(--r-sm); }
    .edrow { display: flex; gap: 7px; margin-top: 10px; }
    .edrow .btn { flex: 1; justify-content: center; }
    .notebox {
      margin-top: 8px; padding: 8px 11px; background: var(--surface-2); border-radius: var(--r-sm);
      font-size: 13px; color: var(--ink-2); white-space: pre-wrap; word-break: break-word;
    }
    .notebox b { font-size: 11px; color: var(--ink-3); letter-spacing: .02em; }
  </style>
</head>
<body>
  <div class="top">
    <div class="brandrow">
      <span class="mark" id="brandMark"></span>
      <span class="nm">NeutronDict</span>
      <span class="streak" id="streakChip" style="display:none"></span>
    </div>
    <div class="searchrow">
      <div class="searchfield">
        <input id="q" type="text" placeholder="Nhập / dán từ cần tra…" autocomplete="off">
      </div>
      <select id="dir" title="Hướng tra">
        <option value="auto" selected>Tự động</option>
        <option value="envi">Anh→Việt</option>
        <option value="vien">Việt→Anh</option>
      </select>
      <button id="go" class="btn primary sm" type="button">Tra</button>
    </div>
  </div>

  <div class="segmented" style="margin:10px 12px 0">
    <button id="tabWord" class="active" type="button">Từ vựng</button>
    <button id="tabDetail" type="button">Chi tiết</button>
    <button id="tabTrans" type="button">Dịch</button>
  </div>

  <div class="body">
    <div id="result" class="state">Đang lấy từ đang chọn…</div>
    <div id="detail" class="detail" style="display:none"></div>
    <div id="trans" style="display:none"></div>
  </div>

  <div class="foot rowx" style="gap:8px">
    <button id="book" class="btn grow" type="button">Sổ tay &amp; tiến độ</button>
    <button id="ipaGuide" class="btn grow" type="button">Hướng dẫn IPA</button>
  </div>

  <script src="ipa-guide.js"></script>
  <script src="icons.js"></script>
  <script src="tien-do.js"></script>
  <script src="popup.js"></script>
</body>
</html>
