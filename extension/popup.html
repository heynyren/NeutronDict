<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <style>
    :root { --brand:#7c3aed; --brand2:#c026d3; --ink:#1c2430; --sub:#6b7684; --line:#e6e9ef; --bg:#fff; --green:#1a9d5a; }
    * { box-sizing: border-box; }
    body { width: 392px; margin: 0; background: var(--bg); color: var(--ink);
      font: 14px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .bar { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid var(--line); align-items: center; }
    #q { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; outline: none; }
    #q:focus { border-color: var(--brand); }
    #dir { padding: 8px 6px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 13px; }
    #go { padding: 8px 12px; border: none; border-radius: 8px;
      background: linear-gradient(135deg,#7c3aed,#c026d3); color: #fff; font-weight: 600; cursor: pointer; }
    .tabs { display: flex; border-bottom: 1px solid var(--line); }
    .tab { flex: 1; padding: 9px 6px; border: none; background: none; font: inherit; font-size: 13px; font-weight: 600;
      color: var(--sub); cursor: pointer; border-bottom: 2px solid transparent; }
    .tab.active { color: var(--brand); border-bottom-color: var(--brand); }
    .tab:disabled { color: #b8bfc9; cursor: default; }
    .body { max-height: 440px; overflow-y: auto; padding: 6px 10px 10px; }
    .entry { padding: 10px 2px; border-bottom: 1px solid var(--line); }
    .entry:last-child { border-bottom: none; }
    .ehead { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .word { font-size: 20px; font-weight: 700; }
    .read { color: var(--brand); font-size: 13.5px; font-weight: 600; margin-left: 6px; }
    .spk { border: none; background: none; font-size: 15px; cursor: pointer; margin-left: 4px; padding: 0 3px; vertical-align: 2px; }
    .spk:hover { transform: scale(1.15); }
    .mean { margin: 4px 0 0; padding-left: 18px; }
    .mean li { margin: 2px 0; }
    .save { flex: none; padding: 5px 9px; border: 1px solid var(--brand); color: var(--brand);
      background: #fff; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .save:hover { background: #f6f1ff; }
    .save.saved { border-color: var(--green); color: var(--green); background: #f0faf4; cursor: default; }
    /* Chi tiết (định nghĩa, ví dụ tiếng Anh) */
    .detail .ipa { color: var(--sub); font-size: 13px; margin: 2px 0 10px; }
    .detail .ipa b { color: var(--brand); }
    .pgroup { padding: 9px 2px; border-bottom: 1px solid var(--line); }
    .pgroup:last-child { border-bottom: none; }
    .pos { display: inline-block; font-size: 11.5px; font-weight: 700; color: #fff; background: var(--brand2);
      border-radius: 5px; padding: 1px 7px; text-transform: lowercase; margin-bottom: 5px; }
    .pgroup ol { margin: 3px 0 0; padding-left: 20px; font-size: 13.5px; }
    .pgroup li { margin: 3px 0; }
    .ex { color: var(--sub); font-style: italic; margin-top: 1px; }
    .syn { color: var(--brand); font-size: 12.5px; margin-top: 5px; }
    .legend { margin-top: 4px; padding: 8px 0 2px; border-top: 1px dashed var(--line); }
    .legend .lh { font-size: 12px; font-weight: 700; color: var(--sub); margin-bottom: 6px; display:flex; justify-content:space-between; align-items:center; }
    .legend .lh a { color: var(--brand); text-decoration: none; font-size: 12px; }
    .legrow { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; font-size: 12.5px; }
    .legrow .ls { font-size: 15px; font-weight: 800; color: var(--brand); min-width: 26px; }
    .legrow .lv { color: #3b3350; }
    .legrow .le { color: var(--sub); }
    .trbox { padding: 4px 2px; }
    .trbox .tr { font-size: 15.5px; line-height: 1.6; }
    .trbox .src { color: var(--sub); font-size: 12.5px; margin-top: 9px; padding-top: 8px; border-top: 1px dashed var(--line); }
    .trbox .hd { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
    .state { padding: 22px 12px; text-align: center; color: var(--sub); }
    .foot { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
    .foot button { flex: 1; text-align: center; padding: 9px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; }
    #book { border: 1px solid var(--line); color: var(--ink); background: #fafbfc; }
    #book:hover { background: #f1f3f6; }
  </style>
</head>
<body>
  <div class="bar">
    <input id="q" type="text" placeholder="Nhập / dán từ cần tra…" autocomplete="off">
    <select id="dir" title="Hướng tra">
      <option value="auto" selected>Tự động</option>
      <option value="envi">Anh→Việt</option>
      <option value="vien">Việt→Anh</option>
    </select>
    <button id="go">Tra</button>
  </div>
  <div class="tabs">
    <button id="tabWord" class="tab active" type="button">Từ vựng</button>
    <button id="tabDetail" class="tab" type="button">Chi tiết</button>
    <button id="tabTrans" class="tab" type="button">Dịch</button>
  </div>
  <div class="body">
    <div id="result" class="state">Đang lấy từ đang chọn…</div>
    <div id="detail" class="detail" style="display:none"></div>
    <div id="trans" style="display:none"></div>
  </div>
  <div class="foot">
    <button id="book" type="button">📒 Sổ tay</button>
    <button id="ipaGuide" type="button">🔤 Hướng dẫn IPA</button>
  </div>
  <script src="ipa-guide.js"></script>
  <script src="popup.js"></script>
</body>
</html>
