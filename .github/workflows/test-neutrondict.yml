name: Test RaKuLanG

on:
  push:
    branches:
      - codex/neutrondict-work
      - codex/neutrondict-youtube-news
      - codex/kaiwa-caption-sync
      - codex/jlpt-n4-n5
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Node tests
        shell: bash
        run: |
          set -u
          failed=0
          for file in kiem-tra/*.mjs; do
            if grep -q '/opt/node22/lib/node_modules/playwright/index.mjs' "$file"; then
              continue
            fi
            echo "::group::$file"
            timeout 300s node "$file" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"

  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify PDF assets shipped in the source checkout
        run: node kiem-tra/pdf-package.mjs
      - name: Install Playwright and Chromium
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/nd-test" playwright
          "$RUNNER_TEMP/nd-test/node_modules/.bin/playwright" install --with-deps chromium
          sudo mkdir -p /opt/node22/lib/node_modules
          sudo ln -s "$RUNNER_TEMP/nd-test/node_modules/playwright" /opt/node22/lib/node_modules/playwright
      - name: Run source-context browser regressions
        run: |
          node kiem-tra/web-context-giao-dien.mjs "$GITHUB_WORKSPACE/extension"
          node kiem-tra/yt-source-giao-dien.mjs "$GITHUB_WORKSPACE/extension"
      - name: Run priority UI and playback regressions
        shell: bash
        run: |
          failed=0
          for file in kiem-tra/jlpt-n45-giao-dien.mjs kiem-tra/kaiwa-giao-dien.mjs kiem-tra/rakulang-ui-giao-dien.mjs kiem-tra/jlpt-dong-bo-giao-dien.mjs kiem-tra/jlpt.mjs kiem-tra/youtube-background-ad.mjs; do
            echo "::group::$file"
            timeout 300s node "$file" "$GITHUB_WORKSPACE/extension" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Run browser tests
        shell: bash
        run: |
          set -u
          failed=0
          for file in kiem-tra/*.mjs; do
            case "$file" in kiem-tra/jlpt-n45-giao-dien.mjs|kiem-tra/kaiwa-giao-dien.mjs|kiem-tra/web-context-giao-dien.mjs|kiem-tra/yt-source-giao-dien.mjs|kiem-tra/rakulang-ui-giao-dien.mjs|kiem-tra/jlpt-dong-bo-giao-dien.mjs|kiem-tra/jlpt.mjs|kiem-tra/youtube-background-ad.mjs) continue;; esac
            if ! grep -q '/opt/node22/lib/node_modules/playwright/index.mjs' "$file"; then
              continue
            fi
            echo "::group::$file"
            timeout 300s node "$file" "$GITHUB_WORKSPACE/extension" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Read tested extension version
        id: extension-version
        run: |
          node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'value=' + require('./extension/manifest.json').version + '\\n')"
      - name: Upload tested extension
        uses: actions/upload-artifact@v4
        with:
          name: RaKuLanG-extension-${{ steps.extension-version.outputs.value }}
          path: extension/
          retention-days: 7
          if-no-files-found: error

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RaKuLanG-extension-ui
          path: ${{ runner.temp }}/nd-ui/
          if-no-files-found: ignore
          retention-days: 7
