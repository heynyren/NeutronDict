name: Dọn kho bản build

# Vì sao có file này
# ------------------
# Tài khoản GitHub miễn phí được 0,5 GB kho chứa bản build, tính CHUNG cho mọi
# repo. File cài Windows 110 MB một bản, nên vài lần đẩy commit là chạm trần.
# Hết chỗ thì bước tải bản build lên hỏng.
#
# Nhưng luồng dọn phải rất dè dặt, vì XOÁ LÀ KHÔNG LẤY LẠI ĐƯỢC. Trước đây nó
# tự chạy sau MỖI lần build và sau đó mỗi ngày, giữ đúng một bản mỗi loại —
# nghĩa là mở một lần chạy cũ ra thì bản build của nó đã bị dọn mất, dù lần
# chạy đó vẫn xanh. Bản build biến mất dưới tay người dùng đúng nghĩa đen.
#
# Nên bây giờ:
#   - CHỈ chạy khi bấm tay. Không hẹn giờ, không tự chạy sau build.
#   - Mặc định giữ 3 bản mỗi loại, không phải 1.
#   - Không đụng vào bản build mới hơn `gio_it_nhat` tiếng (mặc định 24) — thứ
#     vừa build xong là thứ người ta đang cần, đừng bao giờ dọn nó.
#
# Bản build đính trong Releases KHÔNG bị đụng tới: chúng nằm ở kho khác, không
# tính vào 0,5 GB này. Đó mới là chỗ giữ bản cần dùng lâu dài.
on:
  workflow_dispatch:
    inputs:
      giu_lai:
        description: "Giữ lại mấy bản mới nhất của mỗi loại"
        required: false
        default: "3"
      gio_it_nhat:
        description: "Chỉ xoá bản đã cũ hơn bấy nhiêu tiếng (0 = không cần cũ)"
        required: false
        default: "24"

permissions:
  actions: write

concurrency:
  group: don-kho
  cancel-in-progress: false

jobs:
  don:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        env:
          GIU_LAI: ${{ github.event.inputs.giu_lai || '3' }}
          GIO_IT_NHAT: ${{ github.event.inputs.gio_it_nhat || '24' }}
        with:
          script: |
            const giuLai = Number(process.env.GIU_LAI ?? '3');
            const gioItNhat = Number(process.env.GIO_IT_NHAT ?? '24');
            const nguong = Date.now() - gioItNhat * 3600 * 1000;

            // Lấy hết bản build của repo, kể cả trang sau.
            const tatCa = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 },
            );
            const con = tatCa.filter((a) => !a.expired);

            const MB = (b) => (b / 1024 / 1024).toFixed(1);
            const tong = con.reduce((s, a) => s + a.size_in_bytes, 0);
            core.info(`Đang có ${con.length} bản build, tổng ${MB(tong)} MB.`);

            // Nhóm theo tên rồi bỏ mấy bản mới nhất của từng nhóm.
            const theoTen = new Map();
            for (const a of con) {
              if (!theoTen.has(a.name)) theoTen.set(a.name, []);
              theoTen.get(a.name).push(a);
            }

            const xoa = [];
            for (const [ten, ds] of theoTen) {
              ds.sort((x, y) => new Date(y.created_at) - new Date(x.created_at));
              // Giữ mấy bản mới nhất, VÀ giữ luôn mọi bản còn quá mới. Bản vừa
              // build xong là bản người ta đang cần tải; dọn nó đi là phá đúng
              // thứ luồng này lẽ ra phải bảo vệ.
              const duCu = ds.slice(giuLai).filter((a) => new Date(a.created_at).getTime() < nguong);
              const giuViTuoi = ds.length - giuLai - duCu.length;
              core.info(`  ${ten}: ${ds.length} bản · giữ ${Math.min(giuLai, ds.length)} mới nhất`
                + (giuViTuoi > 0 ? ` + ${giuViTuoi} bản chưa đủ ${gioItNhat} tiếng` : "")
                + ` · xoá ${duCu.length}`);
              xoa.push(...duCu);
            }

            let daXoa = 0;
            let thu = 0;
            for (const a of xoa) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: a.id,
                });
                daXoa += 1;
                thu += a.size_in_bytes;
              } catch (loi) {
                // Bản build vừa hết hạn ngay lúc này thì trả 404 — không phải lỗi.
                core.warning(`Không xoá được ${a.name} #${a.id}: ${loi.message}`);
              }
            }

            core.info(`Đã xoá ${daXoa} bản, thu lại ${MB(thu)} MB.`);
            await core.summary
              .addHeading('Dọn kho bản build')
              .addTable([
                [{ data: 'Mục', header: true }, { data: 'Số liệu', header: true }],
                ['Trước khi dọn', `${con.length} bản · ${MB(tong)} MB`],
                ['Đã xoá', `${daXoa} bản · ${MB(thu)} MB`],
                ['Còn lại', `${con.length - daXoa} bản · ${MB(tong - thu)} MB`],
              ])
              .write();
