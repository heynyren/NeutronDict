name: Build Android APK

# Build APK debug ngay trên GitHub. Chạy khi push đổi phần android/, hoặc bấm chạy tay
# ở tab Actions (Run workflow). Kết quả: tải APK ở mục Artifacts của lần chạy, và ở
# Release "latest-debug".
on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Mặc định của GitHub là 6 TIẾNG. Bước dựng SDK vừa treo một lần phải vào
    # huỷ bằng tay — có hàng rào thì lần sau nó tự đỏ sau nửa tiếng.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # KHÔNG dùng android-actions/setup-android nữa.
      #
      # Hai lần liên tiếp luồng này chết ở đúng đây, cả hai lần vì chuyện chẳng
      # liên quan gì tới mã trong kho:
      #
      #   16/9  Mặc định của thẻ @v3 là `sdkmanager tools platform-tools`, mà
      #         Google đã GỠ gói `tools` khỏi kho SDK.
      #           Warning: Failed to find package 'tools'  → hỏng sau 18 giây.
      #
      #   18/9  Ghi rõ `packages: platform-tools` thì qua được chỗ đó, nhưng ảnh
      #         máy đã đổi sang cmdline-tools 12.0 trong khi @v3 chốt cứng bản
      #         16.0. Action chê "Wrong version in preinstalled sdkmanager" rồi
      #         đi tải commandlinetools-linux-12266719 từ dl.google.com — và
      #         nằm im ở đó hơn 4 phút, không nhúc nhích.
      #
      # Cùng một hình dạng lỗi: một thẻ trôi ở ngoài đổi ý, hoặc ảnh máy đổi
      # phiên bản, là luồng đỏ mà trong kho chẳng ai sửa gì. Mà bước này vốn
      # không cần thiết — ảnh ubuntu-latest đã có sẵn Android SDK, cmdline-tools
      # và giấy phép đã ký. Dùng thẳng cái có sẵn thì không còn gì để tải.
      - name: Android SDK (dùng bản có sẵn của máy chạy)
        run: |
          set -eu
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "Không thấy Android SDK ở $SDK"; exit 1; }
          SDKMAN="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMAN" ]; then
            SDKMAN="$(find "$SDK/cmdline-tools" -name sdkmanager -type f -perm -u+x | sort | tail -1)"
          fi
          test -n "$SDKMAN" || { echo "Không thấy sdkmanager trong $SDK"; exit 1; }
          echo "sdkmanager: $SDKMAN"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          # Giấy phép: ảnh máy đã ký sẵn, chạy lại cho chắc và KHÔNG để nó chặn
          # luồng nếu có gì đó khác đi.
          yes | timeout 300 "$SDKMAN" --licenses > /dev/null 2>&1 || true
          # Đúng những gì android/variables.gradle đòi. Có sẵn rồi thì lệnh này
          # không tải gì cả; `timeout` để nếu dl.google.com lại treo thì hỏng
          # nhanh chứ không nằm chờ.
          yes | timeout 900 "$SDKMAN" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          "$SDKMAN" --list_installed || true

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Patch native (menu bôi đen, Chia sẻ, tên app)
        run: node patch-android.js

      - name: Đặt số phiên bản app (1.9)
        run: |
          f=android/app/build.gradle
          sed -i -E 's/versionName "[^"]*"/versionName "1.9"/' "$f" || true
          sed -i -E 's/versionCode [0-9]+/versionCode 11/' "$f" || true
          grep -E 'versionName|versionCode' "$f" || true

      - name: Generate branded icons (tuỳ chọn)
        run: npx --yes @capacitor/assets generate --android || echo "Bỏ qua tạo icon — dùng icon mặc định."

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NeutronDict-debug.apk

      # `continue-on-error` cố ý: kho bản build đầy là chuyện của CÁI KHO, không
      # phải lỗi của mã nguồn. Không có nó thì hết chỗ là bước này đỏ, kéo cả
      # luồng đỏ theo — nhìn vào chỉ thấy "build hỏng" trong khi APK đã đóng gói
      # xong xuôi. Tệ hơn: bước đính vào Releases nằm SAU đây nên cũng không
      # chạy, mất nốt đường lấy file duy nhất còn lại. Đó đúng là cảnh đã xảy ra.
      #
      # Kho GitHub tính lại dung lượng mỗi 6–12 tiếng, nên dọn xong vẫn còn kẹt
      # một lúc; đừng để cái đó chặn build.
      - id: tai_len
        name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: NeutronDict-debug-apk
          path: android/NeutronDict-debug.apk
          if-no-files-found: error
          # APK có 6 MB nhưng vẫn cắt hạn: bản cũ hơn 5 ngày thì đã có bản mới rồi.
          retention-days: 5

      - name: Báo khi kho đầy
        if: steps.tai_len.outcome == 'failure'
        run: |
          {
            echo "## 📦 APK đóng gói xong nhưng chưa tải lên được"
            echo
            echo "Kho bản build của tài khoản đã đầy. Bản thân APK **không sao** —"
            echo "mã nguồn build sạch, chỉ là không có chỗ để cất file."
            echo
            echo "Tải ở mục **Releases** → \`latest-debug\`: Releases nằm ở kho"
            echo "RIÊNG, không tính vào hạn mức 0,5 GB này, nên đường đó luôn còn."
            echo
            echo "Muốn lấy lại chỗ thì chạy luồng **Dọn kho bản build**. Lưu ý"
            echo "GitHub tính lại dung lượng mỗi 6–12 tiếng, xoá xong vẫn phải chờ."
          } >> "$GITHUB_STEP_SUMMARY"

      # Đường lấy file CHẮC ĂN. Releases nằm ở kho riêng, không tính vào hạn mức
      # 0,5 GB của kho bản build — nên kho bản build có đầy thì bước này vẫn chạy
      # và vẫn có file để tải.
      - name: Publish to "latest-debug" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: NeutronDict — debug build
          body: |
            Bản APK debug tự build từ `${{ github.ref_name }}`
            (commit `${{ github.sha }}`).

            Tải file `NeutronDict-debug.apk` bên dưới, mở trên điện thoại và cho phép
            "Cài đặt từ nguồn không xác định" để cài.

            Bản phát hành này bị ghi đè mỗi lần build, nên nó luôn là bản mới nhất —
            và vì Releases nằm ở kho riêng, nó vẫn có kể cả lúc kho bản build đầy.
          prerelease: true
          files: android/NeutronDict-debug.apk
