name: Build Android APK

# Build APK debug ngay trên GitHub. Chạy khi push đổi phần android/, hoặc bấm chạy tay
# ở tab Actions (Run workflow). Kết quả: tải APK ở mục Artifacts của lần chạy, và ở
# Release "latest-debug".
on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Patch native (menu bôi đen, Chia sẻ, tên app)
        run: node patch-android.js

      - name: Đặt số phiên bản app (1.9)
        run: |
          f=android/app/build.gradle
          sed -i -E 's/versionName "[^"]*"/versionName "1.9"/' "$f" || true
          sed -i -E 's/versionCode [0-9]+/versionCode 11/' "$f" || true
          grep -E 'versionName|versionCode' "$f" || true

      - name: Generate branded icons (tuỳ chọn)
        run: npx --yes @capacitor/assets generate --android || echo "Bỏ qua tạo icon — dùng icon mặc định."

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NeutronDict-debug.apk

      # `continue-on-error` cố ý: kho bản build đầy là chuyện của CÁI KHO, không
      # phải lỗi của mã nguồn. Không có nó thì hết chỗ là bước này đỏ, kéo cả
      # luồng đỏ theo — nhìn vào chỉ thấy "build hỏng" trong khi APK đã đóng gói
      # xong xuôi. Tệ hơn: bước đính vào Releases nằm SAU đây nên cũng không
      # chạy, mất nốt đường lấy file duy nhất còn lại. Đó đúng là cảnh đã xảy ra.
      #
      # Kho GitHub tính lại dung lượng mỗi 6–12 tiếng, nên dọn xong vẫn còn kẹt
      # một lúc; đừng để cái đó chặn build.
      - id: tai_len
        name: Upload APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: NeutronDict-debug-apk
          path: android/NeutronDict-debug.apk
          if-no-files-found: error
          # APK có 6 MB nhưng vẫn cắt hạn: bản cũ hơn 5 ngày thì đã có bản mới rồi.
          retention-days: 5

      - name: Báo khi kho đầy
        if: steps.tai_len.outcome == 'failure'
        run: |
          {
            echo "## 📦 APK đóng gói xong nhưng chưa tải lên được"
            echo
            echo "Kho bản build của tài khoản đã đầy. Bản thân APK **không sao** —"
            echo "mã nguồn build sạch, chỉ là không có chỗ để cất file."
            echo
            echo "Tải ở mục **Releases** → \`latest-debug\`: Releases nằm ở kho"
            echo "RIÊNG, không tính vào hạn mức 0,5 GB này, nên đường đó luôn còn."
            echo
            echo "Muốn lấy lại chỗ thì chạy luồng **Dọn kho bản build**. Lưu ý"
            echo "GitHub tính lại dung lượng mỗi 6–12 tiếng, xoá xong vẫn phải chờ."
          } >> "$GITHUB_STEP_SUMMARY"

      # Đường lấy file CHẮC ĂN. Releases nằm ở kho riêng, không tính vào hạn mức
      # 0,5 GB của kho bản build — nên kho bản build có đầy thì bước này vẫn chạy
      # và vẫn có file để tải.
      - name: Publish to "latest-debug" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: NeutronDict — debug build
          body: |
            Bản APK debug tự build từ `${{ github.ref_name }}`
            (commit `${{ github.sha }}`).

            Tải file `NeutronDict-debug.apk` bên dưới, mở trên điện thoại và cho phép
            "Cài đặt từ nguồn không xác định" để cài.

            Bản phát hành này bị ghi đè mỗi lần build, nên nó luôn là bản mới nhất —
            và vì Releases nằm ở kho riêng, nó vẫn có kể cả lúc kho bản build đầy.
          prerelease: true
          files: android/NeutronDict-debug.apk
